<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Random Web Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #4facfe, #00f2fe);
            color: #333;
            text-align: center;
            padding: 50px;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            display: inline-block;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            background: #4facfe;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #0077ff;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>🌟 Welcome!</h1>
        <p id="text">Click the button to see something random.</p>
        <button onclick="randomText()">Click Me</button>
    </div>

    <script>
        const messages = [
            "You are awesome 😎",
            "Today is your lucky day 🍀",
            "Keep coding, you're doing great 💻",
            "Randomness is fun 🎲",
            "This is a simple HTML project 🚀"
        ];

        function randomText() {
            const randomIndex = Math.floor(Math.random() * messages.length);
            document.getElementById("text").innerText = messages[randomIndex];
        }
    </script>

</body>
</html>
